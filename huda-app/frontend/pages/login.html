<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#087c62">
  <title>تسجيل الدخول | هُدى</title>
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand auth-brand" href="../index.html"><img class="brand-logo" src="../assets/logo.png" alt="هُدى"></a>
    <div class="auth-intro"><p class="eyebrow">أهلاً بعودتك</p><h1>سجّل دخولك</h1><p>تابع رحلتك اليومية مع القرآن والذكر.</p></div>
    <form id="login-form" novalidate>
      <label>البريد الإلكتروني<input type="email" name="email" autocomplete="email" placeholder="name@example.com" required></label>
      <label>كلمة المرور<input type="password" name="password" autocomplete="current-password" placeholder="••••••••" minlength="8" required></label>
      <p id="form-message" class="form-message" role="alert" aria-live="polite"></p>
      <button class="button button-primary button-wide" type="submit">دخول</button>
    </form>
    <p class="auth-switch"><a href="forgot-password.html">نسيت كلمة السر؟</a></p>
    <p class="auth-switch">ليس لديك حساب؟ <a href="register.html">أنشئ حساباً</a></p>
  </main>

  <footer class="site-footer"><small class="footer-copyright">© 2026 هُدى. جميع الحقوق محفوظة.</small>
    <div class="footer-social">

    </div>
  </footer>
  
  <!-- Configuration and utilities must load first -->
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <!-- Main application -->
  <script src="../js/app.js"></script>
  <script>
    Huda.redirectIfAuthenticated('../index.html');
    document.getElementById('login-form').addEventListener('submit', async (event) => {
      event.preventDefault(); const form = event.currentTarget; const message = document.getElementById('form-message');
      const submitButton = form.querySelector('button[type="submit"]');
      const email = form.email.value.trim().toLowerCase(), password = form.password.value;
      if (!form.checkValidity()) { message.textContent = 'يرجى إدخال بريد صحيح وكلمة مرور من 8 أحرف على الأقل.'; return; }
      submitButton.disabled = true; message.textContent = '';
      const { ok, data } = await Huda.login(email, password);
      submitButton.disabled = false;
      if (!ok) { message.textContent = data.message || 'تعذر تسجيل الدخول، حاول مرة أخرى.'; return; }
      window.location.replace('../index.html');
    });
  </script>
</body>
</html>
