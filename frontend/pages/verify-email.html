<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تأكيد البريد | هُدى</title><link rel="icon" href="../assets/logo.png"><link rel="stylesheet" href="../css/style.css"></head><body class="auth-page"><main class="auth-card"><a class="brand auth-brand" href="../index.html"><img class="brand-logo" src="../assets/logo.png" alt="هُدى"></a><div class="auth-intro"><p class="eyebrow">خطوة أخيرة</p><h1>تأكيد بريدك الإلكتروني</h1><p id="intro">تم إنشاء حسابك. افتح رسالة التحقق في بريدك واضغط الرابط الموجود فيها.</p></div><p id="status" class="form-message" role="status" aria-live="polite"></p><form id="resend-form"><label>البريد الإلكتروني<input id="email" type="email" required autocomplete="email"></label><button class="button button-primary button-wide" type="submit">إعادة إرسال رسالة التحقق</button></form><p class="auth-switch"><a href="login.html">العودة لتسجيل الدخول</a></p></main>
<footer class="site-footer">
    <small class="footer-copyright">© 2026 ريان رواد الغول — هُدى. جميع الحقوق محفوظة.</small>
    <a class="footer-legal-link" href="copyright.html">حقوق النشر والملكية الفكرية</a>
    <div class="footer-social"></div>
  </footer>
<script src="../js/config.js"></script><script src="../js/utils.js"></script><script src="../js/app.js"></script><script>
(async()=>{const params=new URLSearchParams(location.search);const token=params.get('token');const email=params.get('email');const emailEl=document.getElementById('email');const status=document.getElementById('status');if(email) emailEl.value=email;if(token){document.getElementById('resend-form').hidden=true;status.textContent='جاري توثيق البريد…';try{const r=await fetch(`${CONFIG.API.BASE_URL}/auth/verify-email?token=${encodeURIComponent(token)}`,{credentials:'include'});const d=await r.json();status.textContent=d.message||'تعذّر توثيق البريد.';if(r.ok&&d.success){status.classList.add('success');setTimeout(()=>location.replace('login.html'),1200);}}catch{status.textContent='تعذّر الاتصال بالخادم.';}}document.getElementById('resend-form').addEventListener('submit',async e=>{e.preventDefault();const value=emailEl.value.trim().toLowerCase();if(!HudaUtils.validateEmail(value)){status.textContent='البريد الإلكتروني غير صحيح.';return;}const r=await Huda.resendVerification(value);status.textContent=r.data.message||'تعذّر إعادة إرسال رسالة التحقق.';});})();
</script></body></html>
