<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#087c62">
  <title>نسيت كلمة السر | هُدى</title>
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand auth-brand" href="../index.html"><img class="brand-logo" src="../assets/logo.png" alt="هُدى"></a>

    <section id="request-step">
      <div class="auth-intro">
        <p class="eyebrow">استعادة الحساب</p>
        <h1>نسيت كلمة السر؟</h1>
        <p>أدخل بريدك الإلكتروني وسنرسل إليه رمز تحقق مكوّناً من 6 أرقام.</p>
      </div>

      <form id="forgot-form" novalidate>
        <label>البريد الإلكتروني
          <input type="email" name="email" autocomplete="email" placeholder="name@example.com" required>
        </label>
        <p id="forgot-message" class="form-message" role="alert" aria-live="polite"></p>
        <button class="button button-primary button-wide" type="submit">إرسال رمز التحقق</button>
      </form>
    </section>

    <section id="code-step" hidden>
      <div class="auth-intro">
        <p class="eyebrow">تحقق من بريدك</p>
        <h1>أدخل رمز التحقق</h1>
        <p>أرسلنا رمزاً من 6 أرقام إلى بريدك الإلكتروني. الرمز صالح لمدة 10 دقائق.</p>
      </div>

      <form id="code-form" novalidate>
        <label>رمز التحقق
          <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code"
                 pattern="[0-9]{6}" maxlength="6" placeholder="123456" required>
        </label>
        <p id="code-message" class="form-message" role="alert" aria-live="polite"></p>
        <button class="button button-primary button-wide" type="submit">تحقق من الرمز</button>
      </form>

      <p class="auth-switch"><button id="resend-button" class="text-button" type="button">إرسال رمز جديد</button></p>
    </section>

    <p class="auth-switch"><a href="login.html">العودة إلى تسجيل الدخول</a></p>
  </main>

  <footer class="site-footer"><small class="footer-copyright">© 2026 هُدى. جميع الحقوق محفوظة.</small></footer>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
<script src="../js/pwa.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const requestStep = document.getElementById('request-step');
    const codeStep = document.getElementById('code-step');
    const forgotForm = document.getElementById('forgot-form');
    const codeForm = document.getElementById('code-form');
    const forgotMessage = document.getElementById('forgot-message');
    const codeMessage = document.getElementById('code-message');
    const resendButton = document.getElementById('resend-button');
    let email = '';

    async function requestCode() {
      const response = await fetch(`${CONFIG.API.BASE_URL}/auth/forgot-password`, {
        method: 'POST',
        credentials: 'include',
        headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
        body: JSON.stringify({ email })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.message || 'تعذّر إرسال رمز التحقق.');
      return data;
    }

    forgotForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      email = forgotForm.email.value.trim().toLowerCase();

      if (!forgotForm.checkValidity()) {
        forgotMessage.textContent = 'أدخل بريدًا إلكترونيًا صحيحًا.';
        return;
      }

      const button = forgotForm.querySelector('button[type="submit"]');
      button.disabled = true;
      forgotMessage.textContent = '';

      try {
        await requestCode();
        requestStep.hidden = true;
        codeStep.hidden = false;
        document.querySelector('#code-form input[name="code"]').focus();
      } catch (error) {
        forgotMessage.textContent = error.message || 'تعذّر إرسال رمز التحقق.';
      } finally {
        button.disabled = false;
      }
    });

    codeForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const code = codeForm.code.value.trim();

      if (!/^\d{6}$/.test(code)) {
        codeMessage.textContent = 'أدخل رمز التحقق المكوّن من 6 أرقام.';
        return;
      }

      const button = codeForm.querySelector('button[type="submit"]');
      button.disabled = true;
      codeMessage.textContent = '';

      try {
        const response = await fetch(`${CONFIG.API.BASE_URL}/auth/verify-reset-code`, {
          method: 'POST',
          credentials: 'include',
          headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
          body: JSON.stringify({ email, code })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.success || !data.resetToken) {
          throw new Error(data.message || 'رمز التحقق غير صحيح.');
        }

        // بعد نجاح الرمز فقط نفتح صفحة تغيير كلمة السر.
        window.location.replace(`reset-password.html?token=${encodeURIComponent(data.resetToken)}`);
      } catch (error) {
        codeMessage.textContent = error.message || 'تعذّر التحقق من الرمز.';
        button.disabled = false;
      }
    });

    resendButton.addEventListener('click', async () => {
      resendButton.disabled = true;
      codeMessage.textContent = '';

      try {
        await requestCode();
        codeMessage.textContent = 'تم إرسال رمز جديد إلى بريدك الإلكتروني.';
      } catch (error) {
        codeMessage.textContent = error.message || 'تعذّر إرسال رمز جديد.';
      } finally {
        setTimeout(() => { resendButton.disabled = false; }, 1000);
      }
    });
  </script>
</body>
</html>
