<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087c62">
  <title>تعيين كلمة السر | هُدى</title>
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand auth-brand" href="../index.html"><img class="brand-logo" src="../assets/logo.png" alt="هُدى"></a>
    <div class="auth-intro">
      <p class="eyebrow">استعادة الحساب</p>
      <h1>تعيين كلمة سر جديدة</h1>
      <p>تم التحقق من بريدك الإلكتروني. اختر كلمة سر جديدة لحسابك.</p>
    </div>

    <form id="reset-form" novalidate>
      <label>كلمة السر الجديدة
        <input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required>
      </label>
      <label>تأكيد كلمة السر
        <input type="password" name="confirmPassword" autocomplete="new-password" minlength="8" maxlength="128" required>
      </label>
      <p id="reset-message" class="form-message" role="alert" aria-live="polite"></p>
      <button class="button button-primary button-wide" type="submit">تغيير كلمة السر</button>
    </form>

    <p class="auth-switch"><a href="login.html">العودة إلى تسجيل الدخول</a></p>
  </main>

  <footer class="site-footer">
    <small class="footer-copyright">© 2026 ريان رواد الغول — هُدى. جميع الحقوق محفوظة.</small>
    <a class="footer-legal-link" href="copyright.html">حقوق النشر والملكية الفكرية</a>
    <div class="footer-social"></div>
  </footer>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
<script src="../js/pwa.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    const form = document.getElementById('reset-form');
    const message = document.getElementById('reset-message');

    if (!token) {
      message.textContent = 'رابط إعادة التعيين غير موجود.';
      form.querySelector('button').disabled = true;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!token) return;

      const password = form.password.value;
      const confirmPassword = form.confirmPassword.value;
      if (!form.checkValidity()) {
        message.textContent = 'كلمة السر يجب أن تكون بين 8 و128 حرفًا.';
        return;
      }
      if (password !== confirmPassword) {
        message.textContent = 'كلمتا السر غير متطابقتين.';
        return;
      }

      const button = form.querySelector('button');
      button.disabled = true;
      message.textContent = '';

      try {
        const response = await fetch(`${CONFIG.API.BASE_URL}/auth/reset-password`, {
          method: 'POST',
          credentials: 'include',
          headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
          body: JSON.stringify({token, password})
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.message || 'تعذّر تغيير كلمة السر.');
        message.textContent = 'تم تغيير كلمة السر بنجاح. جارٍ نقلك إلى تسجيل الدخول...';
        setTimeout(() => window.location.replace('login.html'), 900);
      } catch (error) {
        message.textContent = error.message || 'تعذّر تغيير كلمة السر.';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
